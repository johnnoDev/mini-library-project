{% extends 'base.html' %}


{% block title %}
    Quotes
{% endblock %}

{% load static %}

{% block link %}
    <link rel="stylesheet" href="{% static 'quotes/quotes_styles.css' %}">
{% endblock %}

{% block content %}
    <ul>        
        {% for day in days %}
        <li>
            <a href="{% url 'day-quote' day %}">
                {{ day }}
            </a>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
